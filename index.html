<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007aff">
<title>학습 온보딩</title>
<!-- 디자인 시스템: Framework7 9.3.0 (MIT) CSS 만 쓴다. 동작은 assets/app.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7@9.3.0/framework7-bundle.min.css" integrity="sha384-uXNo4N9qJQsAsakeLzu1knQWIq/bxhuX/a1txyOJ+T7+XR25IJ9NaOveXTy4+iUa" crossorigin="anonymous">
<link rel="stylesheet" href="assets/style.css">
<script>
  // 테마: iPhone·iPad 는 iOS 모양, 그 밖은 Material 모양. 기기 설정이 어두우면 dark
  document.documentElement.classList.add(/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) && "ontouchend" in document ? "ios" : "md");
  if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
</script>
</head>
<body>
<div id="app" class="framework7-root">
  <div class="view view-main"><div class="page" id="page">
    <div class="navbar"><div class="navbar-bg"></div><div class="navbar-inner">
      <div class="left" id="nav-left"></div>
      <div class="title ll-path" id="page-title">학습 온보딩</div>
      <div class="right"></div>
    </div></div>
    <div class="page-content" id="content">불러오는 중…</div>
  </div></div>
  <nav class="ll-tabbar hidden" id="tabbar" aria-label="화면"></nav>
  <div class="ll-sheet-backdrop" id="sheet-backdrop"></div>
  <div class="ll-sheet" id="topic-sheet" role="dialog" aria-modal="true" aria-labelledby="topic-sheet-title" aria-hidden="true">
    <div class="ll-sheet-head"><div class="ll-sheet-title" id="topic-sheet-title">주제 바꾸기</div><button type="button" class="ll-sheet-close" id="btn-sheet-close">닫기</button></div>
    <div class="ll-sheet-body" id="topic-sheet-body"></div>
  </div>
  <div class="ll-sheet" id="item-sheet" role="dialog" aria-modal="true" aria-labelledby="item-sheet-title" aria-hidden="true">
    <div class="ll-sheet-head"><div class="ll-sheet-title" id="item-sheet-title">항목 목록</div><button type="button" class="ll-sheet-close" id="btn-item-sheet-close">닫기</button></div>
    <div class="ll-sheet-body" id="item-sheet-body"></div>
  </div>
</div>
<script src="assets/engine.js"></script>
<script src="assets/plan.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
